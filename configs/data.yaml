data:
  provider: jqdata
  sample_start: 2008-01-01
  sample_end: 2022-12-31
  universe:
    name: csi300_historical
    index_code: 000300.XSHG
  benchmark: 000300.XSHG
  frequency: daily
  adjustment: pre_adjusted

point_in_time:
  use_historical_constituents: true
  use_financial_publish_date: true
  preserve_delisted_stocks: true

fields:
  price: [open, high, low, close, volume, money, factor]
  # 停牌/涨跌停：免费账户 get_price 未返回；本地回测不逐笔模拟，聚宽版按平台规则处理
  tradability: [paused, high_limit, low_limit, is_st]
  # 行业：聚宽时点行业不可得，最终采用外部静态 2025 行业映射（industry_sw_l1_map.csv）
  cross_section: [industry_sw_l1, market_cap, circulating_market_cap]
  financial:
    valuation: [pe_ratio, pb_ratio, market_cap, circulating_market_cap]
    indicator: [roe, eps, gross_profit_margin, net_profit_margin]
    balance: [total_assets, total_liability, total_equity]
    income: [total_operating_revenue, net_profit]
    cash_flow: [net_operate_cash_flow]
    # 公告日 pubDate 用于点状时点对齐；get_fundamentals(date=) 本身按公告日取数

storage:
  raw_dir: data/raw
  processed_dir: data/processed
